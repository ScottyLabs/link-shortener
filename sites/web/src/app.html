<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Link Shortener</title>

    <!-- https://webkilt.andrew.cmu.edu/install.html#apps -->
    <!-- CMU's template -->
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,300italic,400,400italic,600,700,700italic"
      rel="stylesheet"
    />
    <!-- cmu.edu doesn't send the CORS headers integrity checks need -->
    <!-- nosemgrep: html.security.audit.missing-integrity.missing-integrity -->
    <link
      href="https://www.cmu.edu/common/standard-v6/css/main.6.7.min.css"
      media="screen"
      rel="stylesheet"
    />
    <!-- nosemgrep: html.security.audit.missing-integrity.missing-integrity -->
    <link
      href="https://www.cmu.edu/common/standard-v6/css/print.min.css"
      media="print"
      rel="stylesheet"
    />
    <!-- nosemgrep: html.security.audit.missing-integrity.missing-integrity -->
    <link href="https://www.cmu.edu/favicon.ico" rel="icon" />
    <!-- nosemgrep: html.security.audit.missing-integrity.missing-integrity -->
    <link href="https://www.cmu.edu/favicon-152.png" rel="apple-touch-icon-precomposed" />
    <meta content="#9f0000" name="msapplication-TileColor" />
    <meta content="https://www.cmu.edu/favicon-144.png" name="msapplication-TileImage" />
    <!-- Carnegie Mellon Web Kilt -->
    <link
      href="https://cdn.jsdelivr.net/gh/cmu-web/cmu-web-kilt@0.4.2/css/cmu-cms.css"
      integrity="sha384-jLB4PsCj8eJZzLvX09Rp//BaeUnjZFFNVOS3iVyZhktnIw9EkiZPVseQWE+Yjz/q"
      crossorigin="anonymous"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/cmu-web/cmu-web-kilt@0.4.2/css/cmu-app.css"
      integrity="sha384-47JHEYH0eYcLdN5TBfxjXH8Pep2phRVwi/F1EqzR+oM66o/7KGNVEubYiKV9QSGh"
      crossorigin="anonymous"
      rel="stylesheet"
    />

    %sveltekit.head%
  </head>
  <body class="no-js cmu-app" data-sveltekit-preload-data="hover">
    <div id="container">%sveltekit.body%</div>
  </body>
</html>
